version: '3.8'

services:
  backend:
    image: dbops-backend:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - DBOPS_DB_DRIVER=sqlite
      - DBOPS_DB_DSN=/data/dbops.db
      - DBOPS_SKIP_AGENT_BINARY_BUILD=true
    volumes:
      - dbops-data:/data
      - ./backend/config:/opt/dbops-platform/config:ro
    depends_on:
      - redis
      - clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent:
    image: dbops-agent:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    environment:
      - DBOPS_BACKEND_URL=http://backend:8080
    volumes:
      - dbops-data:/data
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=dbops
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbops-data:
  redis-data:
  clickhouse-data:
